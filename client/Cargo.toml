[package]
name = "land-client"
version = "0.1.0"
edition = "2024"
description = "land send transaction client"
license = "MIT"

[dependencies]
mio = { version = "1.1", features = ["net", "os-poll"] }
itoa = "1.0"
base64 = "0.22"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1.0.5"

[dev-dependencies]
solana-sdk = "3"
solana-client = "3"
solana-commitment-config = "3"
solana-message ="3"
solana-compute-budget-interface = "3"
solana-address = "2.0.0"
wincode = { version = "0.2.5", features = ["derive", "alloc", "solana-short-vec"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "send"
path = "examples/send.rs"

[[example]]
name = "send_tx"
path = "examples/send_tx.rs"
